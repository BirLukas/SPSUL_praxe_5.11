name: Dashboard

# Sesbírá results/summary.json ze všech PR a nasadí dashboard na GitHub Pages.
# pull_request_target běží nad kódem z main, kód z PR se nikdy nespouští (jen se čte JSON přes API).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 dashboard/build_data.py --selftest
      - run: python3 dashboard/build_data.py dashboard/data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
